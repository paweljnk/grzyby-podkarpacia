  - {drzewo: SW, sila: silny, zrodla: [funga_nordica_2012], wiarygodnosc: B}
  - {drzewo: BK, sila: umiarkowany, zrodla: [gruminska_wojewoda_1985], wiarygodnosc: B}
  - {drzewo: DB, sila: umiarkowany, zrodla: [gruminska_wojewoda_1985], wiarygodnosc: B}
