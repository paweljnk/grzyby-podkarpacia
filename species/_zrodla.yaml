# Bibliografia bazy wiedzy o gatunkach.
# klasa: A — publikacja naukowa; B — monografia / przewodnik / baza nomenklatoryczna; C — wiedza praktyczna / założenie.
# zweryfikowano: metadane = autorzy/tytuł/czasopismo/DOI potwierdzone wyszukiwaniem (2026-10-17), treści nie czytano;
# zweryfikowano: false = opis bibliograficzny podany z pamięci autora pliku; przed publikacją sprawdzić
# w bibliotece/katalogu (tytuł, rok, strony) i potwierdzić, że treść reguły rzeczywiście z niego wynika.
zrodla:
  index_fungorum:
    opis: Index Fungorum. www.indexfungorum.org — aktualne nazwy i synonimy
    klasa: B
    zweryfikowano: false
  mycobank:
    opis: MycoBank Database. www.mycobank.org — nazwy i synonimy
    klasa: B
    zweryfikowano: false
  wojewoda_2003:
    opis: "Wojewoda W. 2003. Checklist of Polish larger Basidiomycetes. W. Szafer Institute of Botany, PAS, Kraków"
    klasa: B
    zweryfikowano: false
  gruminska_wojewoda_1985:
    opis: "Gumińska B., Wojewoda W. 1985. Grzyby i ich oznaczanie. PWRiL, Warszawa"
    klasa: B
    zweryfikowano: false
  funga_nordica_2012:
    opis: "Knudsen H., Vesterholt J. (red.) 2012. Funga Nordica. Agaricoid, boletoid, clavarioid, cyphelloid and gastroid genera. Wyd. 2. Nordsvamp, Kopenhaga"
    klasa: B
    zweryfikowano: false
  dentinger_2010:
    opis: "Dentinger B.T.M. i in. 2010. Molecular phylogenetics of porcini mushrooms (Boletus section Boletus). Molecular Phylogenetics and Evolution 57(3): 1276–1292. doi:10.1016/j.ympev.2010.10.004"
    klasa: A
    zweryfikowano: metadane
  vizzini_2014:
    opis: "Vizzini A. 2014. Nomenclatural novelties. Index Fungorum 147: 1 (rodzaj Imleria; Imleria badia (Fr.) Vizzini). Data wydania podawana różnie: 12.05 lub 12.06.2014"
    klasa: A
    zweryfikowano: metadane
  olariaga_2017:
    opis: "Olariaga I., Moreno G., Manjón J.L., Salcedo I., Hofstetter V., Rodríguez D., Buyck B. 2017. Cantharellus (Cantharellales, Basidiomycota) revisited in Europe through a multigene phylogeny. Fungal Diversity 83(1): 263–292. doi:10.1007/s13225-016-0376-7 (8 gatunków w Europie; epityp C. cibarius)"
    klasa: A
    zweryfikowano: metadane
  boddy_2014:
    opis: "Boddy L. i in. 2014. Climate variation effects on fungal fruiting. Fungal Ecology 10: 20–33. doi:10.1016/j.funeco.2013.10.006 (przegląd: wydłużanie sezonów w Europie; brak progów liczbowych dla gatunków)"
    klasa: A
    zweryfikowano: metadane
  kauserud_2008:
    opis: "Kauserud H. i in. 2008. Mushroom fruiting and climate change. PNAS 105: 3811–3814. doi:10.1073/pnas.0709037105 (Norwegia, ~34,5 tys. rekordów zielnikowych 1940–2006; opóźnienie jesiennego owocnikowania o 12,9 dnia od 1980)"
    klasa: A
    zweryfikowano: metadane
