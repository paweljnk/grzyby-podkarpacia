# Model rekomendacji (Etap 3c). WSZYSTKIE wartości to założenia projektowe do kalibracji (Etap 6),
# nie ustalone zależności biologiczne. Wynik nazywamy "wskaźnikiem rekomendacji 0–100" — nie "szansą".

podstawa:
  # podstawa = A^wA · B^wB (ważona średnia geometryczna): brak siedliska nie jest kompensowany pogodą.
  wagi: {A: 0.5, B: 0.5}

bramki:
  A_min: 30                       # poniżej: miejsce nie trafia do rekomendacji wypraw
  wynik_min: 15                   # wskaźnik poniżej progu (np. poza sezonem) — nie rekomendujemy wyprawy
  susza_najdluzszy_okres_bez_opadu_dni: 21
  # bramka bilansu wodnego jest per gatunek: species/*.yaml pogoda.susza.bilans_14d_mm_bramka_ponizej
  zakaz_rodzaje: [park_narodowy]  # formy ochrony z zakazem zbioru co do zasady (poza miejscami wyznaczonymi)

siedlisko:                        # A
  # gleba = typ/podtyp i gatunek gleby (żyzność); uwilgotnienie = z typu siedliskowego; ph = SoilGrids (model).
  wagi: {drzewa: 0.40, typ_siedliskowy: 0.20, wiek: 0.15, gleba: 0.07, uwilgotnienie: 0.07, ph: 0.06, teren: 0.15}
  sila_zwiazku: {silny: 1.0, umiarkowany: 0.6, slaby: 0.3}
  udzial_nasycenia: 0.5           # łączny ważony udział partnerów >= 0.5 → pełna ocena drzew
  tylko_gatunek_panujacy_udzial: 0.6   # gdy znamy tylko gatunek panujący: przyjęty udział (obniża kompletność)
  typ_siedliskowy: {preferowany: 1.0, dopuszczalny: 0.6, inny: 0.15}
  wiek_ponizej_min: 0.1
  wiek_ponizej_optimum: 0.6
  wiek_powyzej_optimum: 0.8
  teren_poza_zakresem_wysokosci: 0.2
  teren_nachylenie_trudne_deg: 30
  teren_nachylenie_trudne_mnoznik: 0.6
  gleba_zgodna: 1.0
  gleba_niezgodna: 0.4
  uwilgotnienie_zgodne: 1.0
  uwilgotnienie_niezgodne: 0.4
  ph_zgodne: 1.0
  ph_niezgodne: 0.5               # pH z modelu 250 m — słabszy wpływ niż opis z BDL
  # Wiarygodność wejścia przy liczeniu PEWNOŚCI (nie warunków): źródło BDL = 1, model = 0.5, brak = 0.
  pewnosc_zrodla: {zrodlowa: 1.0, model: 0.5}
  teren_pewnosc: 0.8                # DEM to model powierzchni (DSM)
  udzial_nieznany_min: 0.1          # gdy brak udziału gatunku panującego: przyjmujemy przedział [0.1, 1]

pogoda:                           # B
  wagi: {wilgoc: 0.35, opoznienie: 0.25, temperatura: 0.25, wilgotnosc_gleby: 0.15}
  sezon_brzeg: 0.3                # wartość sezonu na początku/końcu okna (rośnie liniowo do szczytu)
  brak_epizodu_opadu: 0.2
  wilgotnosc_gleby_m3m3: {sucha: 0.12, optimum: [0.22, 0.38]}   # model (ERA5-Land/prognoza), komórka siatki
  kara_susza_mnoznik_min: 0.2
  # Nasłonecznienie stoku (model z DEM, grzyby/model/insolation.py): parowanie ET₀ × (1 + k·(indeks − 1)).
  # k i granice to założenie projektowe (klasa C); indeks 1.0 = teren płaski.
  naslonecznienie: {wplyw_na_et0: 0.6, mnoznik_min: 0.6, mnoznik_max: 1.4}

obserwacje:                       # C (modyfikator)
  max_pkt: 15
  polowiczny_czas_dni: 7
  skala_odleglosci_km: 2.0
  promien_km: 10
  waga_nic_nie_znalazlem: 0.6
  jakosc: {wysoka: 1.0, srednia: 0.6, niska: 0.3}

kompletnosc:
  progi: {wysoka: 0.75, srednia: 0.5}
  # pewność obniża też szerokość przedziału warunków (nieznany skład drzewostanu)
  kara_za_szerokosc_przedzialu: 0.5
  prognoza_mnoznik_dnia: 0.97     # każdy dzień prognozy w oknie lekko obniża jakość

zapytania:                        # ograniczenia wydajnościowe API (po przekroczeniu — ostrzeżenie, nie ciche obcięcie)
  limit_wydzielen_ranking: 40000  # najbliższe wydzielenia w promieniu
  limit_wydzielen_mapa: 20000     # wydzielenia w widocznym obszarze mapy
