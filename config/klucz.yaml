# „Pomóż oznaczyć” — pytania o cechy i ich dopasowanie do katalogu. To podpowiedź, nie oznaczenie.
# Wartości z Wikidata (etykiety angielskie właściwości P783–P788) → polskie odpowiedzi.
punkty: {zgodne: 2, niezgodne: -3, brak_danych: 0}
wynikow: 15
pytania:
  - id: hymenium
    pytanie: Co jest pod kapeluszem?
    zrodlo: cechy
    odpowiedzi:
      blaszki: {etykieta: "Blaszki", wartosci: ["lamella", "gills"]}
      rurki: {etykieta: "Rurki (gąbka)", wartosci: ["pores"]}
      listewki: {etykieta: "Listewki (fałdy)", wartosci: ["ridges"]}
      kolce: {etykieta: "Kolce", wartosci: ["teeth"]}
      gladko: {etykieta: "Gładko", wartosci: ["smooth"]}
      gleba: {etykieta: "Brak kapelusza, kulisty owocnik (np. purchawka)", wartosci: ["gleba"]}
  - id: trzon
    pytanie: Jaki jest trzon?
    zrodlo: cechy
    odpowiedzi:
      nagi: {etykieta: "Bez pierścienia i bez pochwy", wartosci: ["bare stipe"]}
      pierscien: {etykieta: "Z pierścieniem", wartosci: ["ring stipe", "ring and volva stipe"]}
      pochwa: {etykieta: "Z pochwą lub bulwą u podstawy", wartosci: ["volva stipe", "ring and volva stipe"]}
      zasnowka: {etykieta: "Z pajęczynowatą zasnówką", wartosci: ["cortina stipe"]}
      brak: {etykieta: "Brak trzonu", wartosci: ["no stipe"]}
  - id: kapelusz
    pytanie: Jaki kształt ma kapelusz?
    zrodlo: cechy
    odpowiedzi:
      wypukly: {etykieta: "Wypukły / półkulisty", wartosci: ["convex mushroom cap", "semi-spherical mushroom cap"]}
      plaski: {etykieta: "Płaski", wartosci: ["flat mushroom cap"]}
      wklesly: {etykieta: "Wklęsły / lejkowaty", wartosci: ["depressed mushroom cap", "infundibuliform mushroom cap"]}
      garbek: {etykieta: "Z garbkiem", wartosci: ["umbonate mushroom cap"]}
      dzwonkowaty: {etykieta: "Dzwonkowaty / stożkowaty / jajowaty", wartosci: ["campanulate mushroom cap", "conical mushroom cap", "ovate mushroom cap"]}
      bokiem: {etykieta: "Bez typowego kapelusza / przyrośnięty bokiem (np. na pniu)", wartosci: ["offset mushroom cap", "no mushroom cap"]}
  - id: wysyp
    pytanie: Jaka jest barwa wysypu zarodników? (kapelusz na kartce na kilka godzin)
    zrodlo: cechy
    odpowiedzi:
      zolty: {etykieta: "Żółty", wartosci: ["yellow"]}
      bialy: {etykieta: "Biały / kremowy", wartosci: ["white", "cream", "buff"]}
      rozowy: {etykieta: "Różowy", wartosci: ["pink", "salmon"]}
      brazowy: {etykieta: "Brązowy / rdzawy / ochrowy", wartosci: ["brown", "tan", "reddish-brown", "yellow-brown", "ochre", "rust"]}
      oliwkowy: {etykieta: "Oliwkowobrązowy", wartosci: ["olive-brown", "olive brown", "olive"]}
      ciemny: {etykieta: "Czarny / purpurowobrązowy", wartosci: ["black", "purple-black", "purple-brown", "blackish-brown", "purple", "bordeaux"]}
  - id: ekologia
    pytanie: Gdzie rośnie?
    zrodlo: cechy
    odpowiedzi:
      ziemia: {etykieta: "Na ziemi, przy drzewach", wartosci: ["mycorrhiza", "mycorrhizal"]}
      drewno: {etykieta: "Na drewnie, ściółce lub szczątkach", wartosci: ["saprobiont", "saprotrophic"]}
      zywy: {etykieta: "Na żywym drzewie lub innym grzybie", wartosci: ["parasitism", "parasitic"]}
  - id: gleba
    pytanie: Na jakiej glebie?
    zrodlo: siedlisko
    odpowiedzi:
      kwasna: {etykieta: "Kwaśna (bory, wrzosy, borówki)", wartosci: ["kwaśna"]}
      wapienna: {etykieta: "Wapienna", wartosci: ["wapienna"]}
      piaszczysta: {etykieta: "Piaszczysta", wartosci: ["piaszczysta"]}
      zyzna: {etykieta: "Żyzna, próchniczna", wartosci: ["żyzna"]}
      mokra: {etykieta: "Podmokła lub torfowa", wartosci: ["podmokła / torfowa"]}
  - id: drzewa
    pytanie: Jakie drzewa rosną obok?
    zrodlo: siedlisko
    wiele: true
    odpowiedzi:
      sosna: {etykieta: "Sosna", wartosci: ["sosna"]}
      swierk: {etykieta: "Świerk", wartosci: ["świerk"]}
      jodla: {etykieta: "Jodła", wartosci: ["jodła"]}
      modrzew: {etykieta: "Modrzew", wartosci: ["modrzew"]}
      buk: {etykieta: "Buk", wartosci: ["buk"]}
      dab: {etykieta: "Dąb", wartosci: ["dąb"]}
      brzoza: {etykieta: "Brzoza", wartosci: ["brzoza"]}
      grab: {etykieta: "Grab", wartosci: ["grab"]}
      topola: {etykieta: "Topola / osika", wartosci: ["topola / osika"]}
      olsza: {etykieta: "Olsza", wartosci: ["olsza"]}
# Rodzaje, w których są gatunki śmiertelnie trujące — przy każdym takim wyniku stałe ostrzeżenie.
rodzaje_smiertelne: [Amanita, Galerina, Lepiota, Cortinarius, Inocybe, Clitocybe, Gyromitra, Conocybe]
ostrzezenie_blaszki: >-
  Grzyby blaszkowe to grupa z najgroźniejszymi pomyłkami. Muchomor zielonawy (śmiertelnie trujący) ma białe blaszki,
  pierścień i bulwę w pochwie u podstawy trzonu — bywa mylony z gąskami, czubajką kanią i gołąbkami.
