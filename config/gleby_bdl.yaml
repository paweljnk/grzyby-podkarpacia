# Kody podtypów gleb z warstwy BDL „Siedliska leśne” (soil_subtype_cd) → cechy porównywane z species/*.yaml.
# Kody: rzeczywiste wartości dla Podkarpacia (rozpoznanie 2026-10-17; najczęstsze: BRwy, BRk, RDb, Bw, BRw, RDbr,
# OGw, Bgw, Gw, RDw, MDbr…). Dopasowanie po NAJDŁUŻSZYM prefiksie kodu.
# Przypisanie odczynu i żyzności do typów/podtypów to ZAŁOŻENIE PROJEKTOWE (klasa C) na podstawie ogólnej
# charakterystyki typów gleb leśnych — nie jest to pomiar. null = nie przypisujemy (cecha nie wchodzi do oceny).
# pH nie jest częścią opisu taksacyjnego; tu podajemy tylko KLASĘ odczynu typową dla podtypu.
podtypy:
  BRk:  {nazwa: brunatna kwaśna,          odczyn: kwasny,       zyznosc: srednia}
  BRb:  {nazwa: brunatna bielicowa,       odczyn: kwasny,       zyznosc: srednia}
  BRwy: {nazwa: brunatna wyługowana,      odczyn: lekko_kwasny, zyznosc: srednia}
  BRw:  {nazwa: brunatna właściwa,        odczyn: lekko_kwasny, zyznosc: zyzna}
  BR:   {nazwa: brunatna,                 odczyn: null,         zyznosc: srednia}
  RDbr: {nazwa: rdzawa brunatna,          odczyn: kwasny,       zyznosc: srednia}
  RDb:  {nazwa: rdzawa bielicowa,         odczyn: kwasny,       zyznosc: uboga}
  RD:   {nazwa: rdzawa,                   odczyn: kwasny,       zyznosc: uboga}
  Bg:   {nazwa: glejobielicowa,           odczyn: kwasny,       zyznosc: uboga}
  B:    {nazwa: bielicowa,                odczyn: kwasny,       zyznosc: uboga}
  P:    {nazwa: płowa,                    odczyn: lekko_kwasny, zyznosc: srednia}
  OG:   {nazwa: opadowo-glejowa,          odczyn: null,         zyznosc: srednia}
  G:    {nazwa: gruntowo-glejowa,         odczyn: null,         zyznosc: srednia}
  MD:   {nazwa: mada,                     odczyn: obojetny,     zyznosc: zyzna}
  MR:   {nazwa: murszowa,                 odczyn: null,         zyznosc: srednia}
  Tw:   {nazwa: torfowa torfowisk wysokich, odczyn: kwasny,     zyznosc: uboga}
  Tp:   {nazwa: torfowa torfowisk przejściowych, odczyn: kwasny, zyznosc: srednia}
  Tn:   {nazwa: torfowa torfowisk niskich, odczyn: lekko_kwasny, zyznosc: zyzna}
  RN:   {nazwa: ranker,                   odczyn: kwasny,       zyznosc: srednia}
  R:    {nazwa: rędzina,                  odczyn: zasadowy,     zyznosc: zyzna}
  D:    {nazwa: deluwialna,               odczyn: null,         zyznosc: srednia}
  M:    {nazwa: mułowa,                   odczyn: null,         zyznosc: null}
  AU:   {nazwa: antropogeniczna,          odczyn: null,         zyznosc: null}

# Klasy odczynu z pH(H2O) warstwy 0–5 cm (SoilGrids, model) — założenie projektowe.
ph_klasy:
  - {do: 5.5, odczyn: kwasny}
  - {do: 6.5, odczyn: lekko_kwasny}
  - {do: 7.2, odczyn: obojetny}
  - {do: 14,  odczyn: zasadowy}
