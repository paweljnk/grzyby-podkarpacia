[project]
name = "grzyby"
version = "0.1.0"
description = "Grzyby Podkarpacia — backend, ETL i model rekomendacji"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "numpy>=1.26",
  "rasterstats>=0.20",
  "skyfield>=1.49",
  "skyfield-data>=7.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grzyby*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: testy wymagające działającej bazy PostGIS"]
