# Rejestr źródeł danych — Grzyby Podkarpacia.
#
# Zasady:
#  - Pole `weryfikacja` aktualizuje automatycznie `make probe` (data, status HTTP, plik ze schematem).
#  - Pole `ostatni_import` aktualizuje importer na podstawie meta.import_log.
#  - Wartości z dokumentacji, których nie potwierdziła próbka, mają `do_weryfikacji: true`.
#  - `null` oznacza: nie wiemy / nie sprawdzone. Nie wstawiamy wartości zastępczych.
#
# Ten plik jest zapisywany programowo (PyYAML), więc uwagi trzymaj w polach `uwagi`, nie w komentarzach
# wewnątrz wpisów — komentarze nagłówka są zachowywane, komentarze w środku nie.
