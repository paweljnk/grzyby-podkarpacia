# Import BAZY danych dla całego województwa (drzewostany LP i poza LP, siedliska/gleby, teren, SoilGrids, pokrycie).
# Comiesięcznie + ręcznie (gałąź `zadanie/baza`). Pliki etapowe w cache Actions → import przyrostowy i wznawialny.
# Wynik: gałąź `dane/baza` (paczka + raport pokrycia). Paczkę dzienną (pogoda, zakazy) robi dane.yml.
name: dane-baza
on:
  schedule:
    - cron: "41 1 3 * *"
  push:
    branches: ["zadanie/baza", "zadanie/baza-proba"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dane-baza
  cancel-in-progress: false
jobs:
  baza:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      db:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_DB: grzyby, POSTGRES_USER: grzyby, POSTGRES_PASSWORD: grzyby}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grzyby -d grzyby" --health-interval 5s --health-timeout 5s --health-retries 20
          --shm-size 1g
    env:
      DATABASE_URL: postgresql://grzyby:grzyby@localhost:5432/grzyby
      GRZYBY_ROOT: ${{ github.workspace }}
      TZ: Europe/Warsaw
      # przebieg próbny (gałąź zadanie/baza-proba): 2 nadleśnictwa i ich kafle; publikacja na dane/baza-proba
      GRZYBY_LIMIT_UNITS: ${{ github.ref_name == 'zadanie/baza-proba' && '2' || '0' }}
      CEL: ${{ github.ref_name == 'zadanie/baza-proba' && 'dane/baza-proba' || 'dane/baza' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - name: Cache plików etapowych i rastrów (wznawianie, import przyrostowy)
        uses: actions/cache@v4
        with:
          path: |
            data/stage
            data/raw
          key: baza-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: baza-
      - run: pip install ./backend
      - run: python -c "from grzyby.db import migrate; print(migrate())"
      - name: Import województwa
        run: python -m grzyby.cli import wojewodztwo-all 2>&1 | tee -a log.txt
      - name: Komórki pogodowe
        run: python -c "from grzyby.db import connect; from grzyby.weather.openmeteo import ensure_cells_for_forests as e; print(len(e(connect(), 0.1)), 'komórek')" | tee -a log.txt
      - name: Raport pokrycia i kontrola
        run: |
          python -m grzyby.cli raport out 2>&1 | tee -a log.txt
          python -m grzyby.cli check-data > out/raport_check_data.txt 2>&1 || true
      - name: Eksport paczki bazowej
        run: python -m grzyby.cli snapshot export out --pakiet baza 2>&1 | tee -a log.txt
      - name: Publikacja (dane/baza)
        run: |
          grep -vE "HTTP Request|INFO httpx" log.txt > out/log_importu.txt || true
          cat > out/README.md <<'MD'
          # Paczka bazowa — Grzyby Podkarpacia (województwo podkarpackie)
          Raport: `raport_pokrycia.md`. Manifest: `manifest.json`. Generowana przez `.github/workflows/dane-baza.yml`.
          Źródła i licencje: Bank Danych o Lasach (CC BY 4.0, dane.gov.pl zbiór 629; zgodnie z warunkami BDL operator
          został/zostanie poinformowany o przetworzeniu danych), PRG (GUGiK), Copernicus DEM, ESA WorldCover 2021 (CC BY 4.0),
          ISRIC SoilGrids 2.0 (CC BY 4.0). Geometrie wydzieleń uproszczone o 1 m — tylko w tej paczce.
          MD
          cd out && git init -q -b "$CEL" && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Paczka bazowa $(date -u +%FT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$CEL"
      - name: Log błędu (dane/log)
        if: failure()
        run: |
          mkdir -p errlog && cp -f log.txt errlog/ 2>/dev/null || true; echo "baza ${{ github.run_id }} $(date -u)" > errlog/run.txt
          cd errlog && git init -q -b dane/log && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm "log błędu bazy" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dane/log
