uwagi:
  - Ryzyko oceniono jako niskie, bo gatunek jest w Polsce rzadki i wyraźnie odmienny — ale skutki pomyłki są poważne.
  - Wiele borowików z czerwonymi porami lub siniejącym miąższem bywa mylonych ze sobą — początkujący nie powinni zbierać żadnych grzybów rurkowych z czerwonymi porami.
