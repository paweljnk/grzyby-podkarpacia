id: tylopilus_felleus
nazwa_polska: goryczak żółciowy
nazwa_naukowa: Tylopilus felleus (Bull.) P. Karst.
status: niejadalny
status_uwagi: Bardzo gorzki; jeden owocnik może zepsuć całą potrawę. Nie próbuj smaku jako metody sprawdzania.
grupa: rurkowe
cechy:
  kapelusz: Jasnobrązowy, ochrowobrązowy do oliwkowobrązowego, matowy.
  hymenofor: Pory u młodych białawe, z wiekiem RÓŻOWE do brudnoróżowych.
  trzon: Z wyraźną, CIEMNĄ (brązową), grubooczkową siateczką na jaśniejszym tle.
  miazsz: Biały, po przekrojeniu nie sinieje (czasem lekko różowieje).
  siedlisko: Bory i lasy mieszane, gleby kwaśne; często przy pniakach.
zrodla: [gruminska_wojewoda_1985, funga_nordica_2012]
weryfikacja: {status: wersja_robocza, zatwierdzil: null, data: null}
