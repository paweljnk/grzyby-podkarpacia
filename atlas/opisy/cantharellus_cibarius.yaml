id: cantharellus_cibarius
nazwa_polska: pieprznik jadalny (kurka)
nazwa_naukowa: Cantharellus cibarius Fr.
status: jadalny
grupa: listewkowe
cechy:
  kapelusz: Jaskrawożółty (barwa żółtka jaja), jednolity, z falistym, podwiniętym brzegiem; z wiekiem lejkowaty.
  hymenofor: LISTEWKI, nie blaszki — grube, tępe, niskie, widlasto rozgałęzione i połączone żyłkami, daleko zbiegające na trzon.
  trzon: Pełny, zwarty, tej samej barwy co kapelusz, zwężający się ku dołowi.
  miazsz: Białawy do bladożółtego, zwarty, w trzonie włóknisty.
  siedlisko: Na ziemi w lasach iglastych i liściastych (mikoryza), często wśród mchów.
zrodla: [gruminska_wojewoda_1985, funga_nordica_2012]
weryfikacja: {status: wersja_robocza, zatwierdzil: null, data: null}
