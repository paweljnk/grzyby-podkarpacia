id: hygrophoropsis_aurantiaca
nazwa_polska: lisówka pomarańczowa
nazwa_naukowa: Hygrophoropsis aurantiaca (Wulfen) Maire
status: niepewny
status_uwagi: Uznawana za niejadalną lub o niepewnej jadalności; u części osób może wywołać dolegliwości żołądkowo-jelitowe.
grupa: blaszkowe
cechy:
  kapelusz: Pomarańczowy do pomarańczowobrązowego, często ciemniejszy i zamszowy w środku, cienki.
  hymenofor: Prawdziwe BLASZKI — cienkie, gęste, ostre, wielokrotnie widlasto rozwidlone, zwykle intensywniej pomarańczowe niż kapelusz.
  trzon: Cienki, często wygięty, pomarańczowy do brązowawego.
  miazsz: Miękki, cienki, pomarańczowawy.
  siedlisko: Saprotrof — na ściółce i rozkładającym się drewnie, zwłaszcza w lasach iglastych.
zrodla: [gruminska_wojewoda_1985, funga_nordica_2012]
weryfikacja: {status: wersja_robocza, zatwierdzil: null, data: null}
